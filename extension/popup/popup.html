<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Roxol settings</title>
    <link rel="stylesheet" href="popup.css" />
    <script src="../shared/trades.js" defer></script>
    <script src="popup.js" defer></script>
  </head>
  <body>
    <main>
      <header class="masthead">
        <h1>Roxol</h1>
      </header>

      <section class="trade-panel" aria-labelledby="trade-heading">
        <h2 id="trade-heading">Roblox Trades</h2>
        <p id="account-status" role="status">Checking Roblox session…</p>
        <p id="page-status" hidden>Roxol is active on this Trades tab.</p>
        <a id="open-trades" target="_blank" rel="noopener noreferrer">
          Open Trades <span aria-hidden="true">↗</span>
        </a>
      </section>

      <section class="preferences" aria-labelledby="preferences-heading">
        <h2 id="preferences-heading">Preferences</h2>
        <div class="preference-row">
          <label for="theme">Appearance</label>
          <select id="theme" disabled>
            <option value="system">System</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </div>
        <p id="settings-status" role="status" hidden></p>
      </section>
    </main>
  </body>
</html>
